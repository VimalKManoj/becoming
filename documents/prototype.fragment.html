<style>
#form-app{--f-bg:light-dark(#f5f5ef,#171c18);--f-paper:light-dark(#fffef9,#202720);--f-ink:light-dark(#223b2f,#e4eddf);--f-muted:light-dark(#607064,#a6b7a8);--f-line:light-dark(#d9dfd3,#39463a);--f-soft:light-dark(#e7eddf,#303f30);--f-accent:light-dark(#265b3e,#afd299);--f-on:light-dark(#fffef9,#20311e);--f-warm:light-dark(#f1e6cc,#433c29);color:var(--f-ink);background:var(--f-bg);font-family:Inter,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;border:1px solid var(--f-line);border-radius:20px;overflow:hidden;isolation:isolate}
#form-app *{box-sizing:border-box}#form-app button,#form-app input,#form-app select,#form-app textarea{font:inherit}#form-app button{cursor:pointer}#form-app button:disabled{cursor:default;opacity:.5}#form-app h1,#form-app h2,#form-app h3,#form-app p{margin:0}#form-app h1{font-family:Georgia,serif;font-size:34px;line-height:1.2;font-weight:400;letter-spacing:-1px}#form-app h2{font-size:19px;font-weight:500}#form-app h3{font-size:16px;font-weight:500}#form-app .f-small{font-size:12px;color:var(--f-muted)}#form-app .f-muted{color:var(--f-muted)}#form-app .f-shell{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:720px}#form-app .f-side{padding:26px 16px;background:var(--f-paper);border-right:1px solid var(--f-line);display:flex;flex-direction:column;gap:28px}#form-app .f-brand{font-family:Georgia,serif;font-size:31px;letter-spacing:-1.5px;padding:0 12px;display:flex;align-items:center;gap:10px}#form-app .f-logo{display:inline-block;width:21px;height:30px;border-radius:18px 2px 18px 2px;background:var(--f-accent);transform:rotate(12deg)}#form-app nav{display:grid;gap:6px}#form-app .f-nav{border:0;background:transparent;color:var(--f-muted);text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:10px}#form-app .f-nav[aria-current=page]{background:var(--f-soft);color:var(--f-ink)}#form-app .f-side-note{margin-top:auto;padding:14px 12px;border-top:1px solid var(--f-line)}#form-app .f-main{min-width:0;padding:25px 30px 30px}#form-app .f-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}#form-app .f-avatar{display:flex;align-items:center;gap:8px}#form-app .f-avatar span{display:grid;place-items:center;border-radius:50%;width:28px;height:28px;background:var(--f-soft)}#form-app .f-eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;font-weight:500;color:var(--f-muted)}#form-app .f-heading{display:flex;justify-content:space-between;align-items:start;gap:14px;margin-bottom:22px}#form-app .f-heading p{margin-top:8px}#form-app .f-btn{padding:9px 14px;border:1px solid var(--f-line);border-radius:8px;background:var(--f-paper);color:var(--f-ink);display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:40px}#form-app .f-primary{background:var(--f-accent);color:var(--f-on);border-color:var(--f-accent)}#form-app .f-ghost{background:transparent;border-color:transparent}#form-app .f-btn:hover,#form-app .f-nav:hover{filter:brightness(.96)}#form-app .f-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#form-app .f-between{justify-content:space-between}#form-app .f-space{margin-top:20px}#form-app .f-panel{background:var(--f-paper);border:1px solid var(--f-line);border-radius:14px;padding:20px}#form-app .f-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#form-app .f-three{grid-template-columns:repeat(3,minmax(0,1fr))}#form-app .f-stack{display:grid;gap:14px}#form-app .f-pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;background:var(--f-soft);font-size:11px;color:var(--f-ink)}#form-app .f-warm{background:var(--f-warm)}#form-app .f-capacity{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}#form-app .f-segments{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}#form-app .f-chip{background:transparent;color:var(--f-muted);border:1px solid var(--f-line);padding:7px 10px;border-radius:7px;min-height:36px}#form-app .f-chip[aria-pressed=true]{background:var(--f-ink);color:var(--f-paper);border-color:var(--f-ink)}#form-app select,#form-app input,#form-app textarea{max-width:100%;width:100%;border:1px solid var(--f-line);border-radius:8px;color:var(--f-ink);background:var(--f-paper);padding:10px;font-size:16px}#form-app textarea{resize:vertical;min-height:90px}#form-app label{display:grid;gap:7px;font-size:12px;color:var(--f-muted)}#form-app .f-energy{min-width:150px}#form-app .f-focus{background:var(--f-soft);padding:25px;border-radius:16px;position:relative}#form-app .f-focus h2{font-family:Georgia,serif;font-size:29px;line-height:1.18;letter-spacing:-.5px;max-width:470px;margin:17px 0 10px}#form-app .f-focus .f-desc{max-width:490px;color:var(--f-muted)}#form-app .f-rule{margin:20px 0;padding:13px 0;border-top:1px solid var(--f-line);border-bottom:1px solid var(--f-line);display:grid;gap:4px}#form-app .f-alt{display:flex;flex-direction:column;gap:9px;padding:16px}#form-app .f-alt .f-btn{align-self:start;margin-top:auto}#form-app .f-track{height:6px;background:var(--f-soft);border-radius:8px;overflow:hidden;margin:10px 0}#form-app .f-track span{display:block;height:100%;background:var(--f-accent);border-radius:8px}#form-app .f-week{display:flex;gap:7px;align-items:center}#form-app .f-dot{width:25px;height:25px;display:grid;place-items:center;background:var(--f-soft);border-radius:50%;color:var(--f-muted);font-size:11px}#form-app .f-dot.f-filled{background:var(--f-accent);color:var(--f-on)}#form-app .f-bottom{margin-top:20px;padding-top:16px;border-top:1px solid var(--f-line)}#form-app .f-lane{padding:14px;border-radius:12px;background:var(--f-soft);min-width:0}#form-app .f-work-card{padding:15px;background:var(--f-paper);border:1px solid var(--f-line);border-radius:10px;margin-top:12px;display:grid;gap:9px}#form-app .f-work-card button{text-align:left;justify-content:start}#form-app .f-notebook{border-top:3px solid var(--f-accent);display:grid;gap:12px;align-content:start}#form-app .f-list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--f-line)}#form-app .f-list-row:last-child{border-bottom:0}#form-app .f-preview{height:130px;background:var(--f-soft);display:grid;place-items:center;border-radius:9px;padding:20px;position:relative;overflow:hidden}#form-app .f-demo-toggle{width:86px;height:43px;border-radius:30px;background:var(--f-accent);padding:5px}#form-app .f-demo-toggle span{display:block;background:var(--f-paper);width:33px;height:33px;border-radius:50%;margin-left:auto}#form-app .f-type-preview{font-family:Georgia,serif;font-size:28px;line-height:1.1;transform:rotate(-5deg);text-align:center}#form-app .f-hero-number{font-family:Georgia,serif;font-size:40px;line-height:1.2;margin:10px 0}#form-app .f-session{max-width:590px;margin:0 auto}#form-app .f-check{display:flex;gap:10px;align-items:center}#form-app .f-check input{width:auto;accent-color:var(--f-accent)}#form-app .f-notice{padding:12px 15px;background:var(--f-warm);border-radius:9px;color:var(--f-ink)}#form-app #f-status:empty{display:none}#form-app #f-status{padding:12px 20px;background:var(--f-soft);border-bottom:1px solid var(--f-line)}#form-app .f-empty{text-align:center;padding:36px 15px}#form-app .f-steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}#form-app .f-step{padding:7px 10px;border-radius:20px;background:var(--f-soft);font-size:12px}#form-app .f-step.f-current{background:var(--f-accent);color:var(--f-on)}#form-app .f-hidden{display:none}#form-app .f-panel,#form-app .f-focus{transition:border-radius .2s ease}#form-app .f-done-mark{width:46px;height:46px;border-radius:50%;background:var(--f-accent);color:var(--f-on);display:grid;place-items:center;font-size:24px;margin-bottom:20px}#form-app .f-reference{color:var(--f-accent);overflow-wrap:anywhere}#form-app .f-caption{margin-top:9px;font-size:12px;color:var(--f-muted)}
@media(max-width:780px){#form-app .f-shell{grid-template-columns:145px minmax(0,1fr)}#form-app .f-side{padding:22px 9px}#form-app .f-main{padding:22px 20px}#form-app .f-three{grid-template-columns:1fr}#form-app .f-heading{flex-wrap:wrap}}
@media(max-width:560px){#form-app .f-shell{display:block;min-height:0}#form-app .f-side{padding:15px;border-right:0;border-bottom:1px solid var(--f-line);gap:12px}#form-app .f-brand{padding:0;font-size:27px}#form-app nav{display:flex;flex-wrap:wrap;gap:2px}#form-app .f-nav{padding:8px;font-size:12px;gap:5px}#form-app .f-side-note{display:none}#form-app .f-main{padding:20px 16px}#form-app .f-top{margin-bottom:24px}#form-app .f-grid{grid-template-columns:1fr}#form-app h1{font-size:29px}#form-app .f-focus{padding:20px}#form-app .f-focus h2{font-size:25px}#form-app .f-list-row{align-items:start;flex-wrap:wrap}#form-app .f-heading{gap:12px}#form-app .f-energy{width:100%}}
@media(pointer:coarse){#form-app button{min-height:44px}}@media(prefers-reduced-motion:reduce){#form-app *{transition:none!important;animation:none!important}}
</style>
<div id="form-app" aria-label="Form design-engineering workspace prototype">
<div id="f-status" role="status" aria-live="polite"></div>
<div class="f-shell">
<aside class="f-side"><div class="f-brand"><span class="f-logo" aria-hidden="true"></span>form.</div><nav aria-label="Main navigation" id="f-nav"></nav><div class="f-side-note"><div class="f-eyebrow">Your north star</div><p id="f-motive" style="margin-top:9px">Become a thoughtful design engineer.</p><p class="f-small" style="margin-top:12px">One useful session at a time.</p></div></aside>
<main class="f-main"><div class="f-top"><span class="f-small">PERSONAL WORKSPACE <span aria-hidden="true"> / </span> <span id="f-crumb">Today</span></span><div class="f-avatar"><span>V</span><small class="f-small">Sample mode</small></div></div><div id="f-view"></div></main>
</div></div>
<script>
(()=>{
const root=document.getElementById('form-app');
const view=root.querySelector('#f-view');
const lanes=['Projects','Showcases','Writing'];
const nav=[['Today','sun'],['Work','layers'],['Ideas','lightbulb'],['Proof','image'],['Journey','sprout'],['Settings','sliders-horizontal']];
let tasks=[
 {id:1,title:'Build the Today focus card',lane:'Projects',project:'Form · Personal workspace',mins:60,energy:2,state:'In progress',skill:'React · interaction design',done:'Responsive card with default, empty, and completed states.',next:'Start with the mobile layout and its action hierarchy.',small:'Sketch the three focus-card states',smallDone:'Save a sketch of the default, empty, and completed states.',smallMins:15},
 {id:2,title:'Polish the expandable card',lane:'Showcases',project:'Interaction collection',mins:30,energy:1,state:'Ready',skill:'Motion · accessibility',done:'One smooth expansion with keyboard support and reduced motion.',next:'Check focus behaviour before tuning the spring.',small:'Review keyboard focus in the card',smallDone:'Record any focus issues and one proposed fix.',smallMins:15},
 {id:3,title:'Write the toggle interaction breakdown',lane:'Writing',project:'From component to story',mins:30,energy:1,state:'Ready',skill:'Technical communication',done:'A short draft explaining the decision, implementation, and lesson.',next:'Use the toggle demo saved in Proof.',small:'Outline the toggle breakdown',smallDone:'Save a three-point outline: decision, implementation, lesson.',smallMins:15}
];
let ideas=[{id:1,title:'A reading corner for the web',lane:'Projects',notes:'A calm place for saved articles. Explore a reading progress interaction and a small typography system.',active:false},{id:2,title:'Magnetic navigation experiment',lane:'Showcases',notes:'A pointer-following indicator with a clear keyboard equivalent. Start with three links and one motion treatment.',active:false},{id:3,title:'What makes a component feel finished?',lane:'Writing',notes:'Collect examples of small details: focus states, empty states, interrupted animations, and reduced motion.',active:false}];
let history=[{title:'Built the toggle states',lane:'Showcases',outcome:'Finished',note:'Captured a demo and checked reduced motion.',when:'Earlier this week'},{title:'Mapped the Today flow',lane:'Projects',outcome:'Made progress',note:'Chose one recommended focus with two alternatives.',when:'Earlier this week'}];
let proofs=[{id:1,title:'A considered toggle',kind:'Interactive component',state:'Ready to share',note:'Default, focus and reduced-motion states captured.',type:'toggle',url:''},{id:2,title:'Designing for a tired evening',kind:'Process notes',state:'Draft',note:'The decisions behind a single-focus Today screen.',type:'type',url:''}];
let state={page:'Today',time:60,energy:2,chosen:null,current:null,ideaId:null,proofId:null,target:3,motive:'Become a thoughtful design engineer.',step:1,paused:false};
const visual={corners:14,celebrations:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,primary=false,extra='')=>`<button type="button" class="f-btn ${primary?'f-primary':''}" data-action="${action}" ${extra}>${label}</button>`;
const heading=(eyebrow,title,sub,action='')=>`<div class="f-heading"><div><div class="f-eyebrow">${eyebrow}</div><h1 style="margin-top:8px">${title}</h1><p class="f-muted">${sub}</p></div>${action}</div>`;
const pill=(x,warm=false)=>`<span class="f-pill ${warm?'f-warm':''}">${esc(x)}</span>`;
function notify(msg){root.querySelector('#f-status').textContent=msg;}
function icon(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
function available(){return tasks.filter(t=>!['Done','Blocked'].includes(t.state)).map(t=>({...t,short:t.mins>state.time||t.energy>state.energy})).filter(t=>!t.short||t.small&&t.smallMins<=state.time);}
function candidates(){const counts=Object.fromEntries(lanes.map(l=>[l,history.slice(-6).filter(h=>h.lane===l).length]));return available().sort((a,b)=>counts[a.lane]-counts[b.lane]||Number(b.state==='In progress')-Number(a.state==='In progress')||a.id-b.id);}
function displayTitle(t){return t.short?t.small:t.title;}function duration(t){return t.short?t.smallMins:t.mins;}function doneText(t){return t.short?t.smallDone:t.done;}
function activeTask(){const list=candidates();return list.find(t=>t.id===state.chosen)||list[0];}
function week(){const n=history.length;return `<div class="f-row f-between f-bottom"><div><div class="f-small">${state.paused?'This week is paused':'YOUR WEEKLY COMMITMENT'}</div><p>${state.paused?'Pick up whenever you are ready.':`${n} of ${state.target} sessions · ${n>=state.target?'weekly target met':'keep a little room for yourself'}`}</p></div><div class="f-week" aria-label="${n} of ${state.target} sessions">${Array.from({length:state.target},(_,i)=>`<span class="f-dot ${i<n?'f-filled':''}">${i<n?'✓':i+1}</span>`).join('')}</div></div>`;}
function today(){const t=activeTask();return heading('Monday, 14 September','A little progress, well chosen.','Make room for the work you want to be known for.')+`<div class="f-capacity"><div><span class="f-small">How much time do you have?</span><div class="f-segments">${[15,30,60,90].map(n=>`<button class="f-chip" data-time="${n}" aria-pressed="${state.time===n}">${n} min</button>`).join('')}</div></div><label class="f-energy">Your energy<select id="f-energy"><option value="1" ${state.energy===1?'selected':''}>Low · keep it light</option><option value="2" ${state.energy===2?'selected':''}>Steady · ready to focus</option><option value="3" ${state.energy===3?'selected':''}>High · room to explore</option></select></label></div>`+(t?`<section class="f-focus" aria-label="Recommended focus"><div class="f-row f-between"><span class="f-eyebrow">${state.chosen?'Your chosen focus':'Recommended for tonight'}</span>${pill(t.lane)}</div><h2>${esc(displayTitle(t))}</h2><p class="f-desc">${esc(t.project)} · ${duration(t)} minutes</p><div class="f-rule"><span class="f-small">WHY THIS FITS</span><p>${state.chosen?'You chose this focus for your next session.':`${t.lane} has room for attention in your recent sessions.`} ${t.short?'This smaller step fits your capacity.':'The next step fits the time you have.'}</p></div><p class="f-small">DONE WHEN</p><p>${esc(doneText(t))}</p><div class="f-row f-between f-space">${button('Start this session →','start',true)}<span class="f-small">${esc(t.skill)}</span></div></section><div class="f-row f-between f-space"><h3>Another way to move forward</h3><span class="f-small">Your choice, always</span></div><div class="f-grid f-space">${candidates().filter(x=>x.id!==t.id).slice(0,2).map(x=>`<article class="f-panel f-alt"><span class="f-eyebrow">${esc(x.lane)} · ${duration(x)} MIN</span><h3>${esc(displayTitle(x))}</h3><p class="f-small">${esc(x.project)}</p>${button('Choose this','choose',false,`data-id="${x.id}"`)}</article>`).join('')}</div>`:`<div class="f-panel f-empty"><h2>A little space to begin.</h2><p class="f-muted f-space">No ready task fits this session. Activate an idea or adjust your capacity.</p><div class="f-space">${button('Explore your ideas','nav-ideas',true)}</div></div>`)+week();}
function work(){return heading('Your commitments','Small steps. Substantial work.','Keep all three parts of your practice moving.',button('Add from ideas','nav-ideas'))+`<div class="f-grid f-three">${lanes.map(l=>`<section class="f-lane"><div class="f-row f-between"><h3>${l}</h3><span class="f-small">${tasks.filter(t=>t.lane===l&&t.state!=='Done').length} active</span></div>${tasks.filter(t=>t.lane===l).map(t=>`<article class="f-work-card">${pill(t.state,t.state==='Blocked')}<h3>${esc(t.title)}</h3><p class="f-small">${esc(t.project)}</p><p class="f-small">${t.mins} min · ${esc(t.skill)}</p>${button('View work →','task',false,`data-id="${t.id}"`)}</article>`).join('')}</section>`).join('')}</div><section class="f-panel f-space"><div class="f-row f-between"><div><div class="f-eyebrow">Primary project</div><h2>Form · Personal workspace</h2></div>${button('Open project →','project')}</div><div class="f-track" aria-label="1 of 4 milestones complete"><span style="width:25%"></span></div><p class="f-small">1 of 4 sample milestones complete · Next: usable Today flow</p></section>`;}
function taskDetail(){const t=tasks.find(t=>t.id===state.taskId);return button('← All work','nav-work')+`<div class="f-space">${heading(esc(t.lane),esc(t.title),esc(t.project))}</div><div class="f-panel f-stack">${pill(t.state)}<div><span class="f-small">DONE WHEN</span><p>${esc(t.done)}</p></div><div><span class="f-small">PICK UP HERE</span><p>${esc(t.next)}</p></div><div><span class="f-small">SKILLS TO PRACTISE</span><p>${esc(t.skill)}</p></div><div class="f-row">${t.state==='Done'?pill('Completed'):t.state==='Blocked'?button('Mark unblocked','unblock',true,`data-id="${t.id}"`):button('Choose for today →','choose',true,`data-id="${t.id}"`)}</div></div>`;}
function project(){return button('← All work','nav-work')+`<div class="f-space">${heading('Primary project','Form · Personal workspace','Help a tired evening become a useful next step.')}</div><div class="f-grid"><section class="f-panel"><div class="f-eyebrow">The outcome</div><h2 class="f-space">A practice worth building.</h2><p class="f-muted f-space">Choose tonight’s focus, collect your ideas, and turn consistent sessions into a body of work.</p><p class="f-small f-space">FIRST RELEASE</p><p>Today → focused session → recap → resume.</p></section><section class="f-panel"><div class="f-eyebrow">Milestones</div>${['✓ Define the product and flows','02 Build a usable Today flow','03 Connect ideas and balanced work','04 Gather proof and refine'].map(x=>`<div class="f-list-row">${x}</div>`).join('')}</section></div><div class="f-panel f-space"><div class="f-row f-between"><div><span class="f-small">NEXT CONCRETE STEP</span><h3>Build the Today focus card</h3></div>${button('View task','task',true,'data-id="1"')}</div></div>`;}
function ideaList(){return heading('Room for possibility','Give your ideas somewhere to grow.','Saving an idea does not add it to today’s work.',button('+ Capture idea','new-idea',true))+`<div class="f-grid">${ideas.map(i=>`<article class="f-panel f-notebook"><div class="f-row f-between">${pill(i.lane)}<span class="f-small">${i.active?'Active work linked':'Exploring'}</span></div><h2>${esc(i.title)}</h2><p class="f-muted">${esc(i.notes.slice(0,160))}${i.notes.length>160?'…':''}</p>${button('Open notebook →','idea',false,`data-id="${i.id}"`)}</article>`).join('')}</div>`;}
function ideaForm(){return button('← Ideas','nav-ideas')+`<div class="f-space">${heading('Quick capture','A thought is enough to start.','Keep your own idea or paste a scheduled assignment.')}</div><form id="f-idea-form" class="f-panel f-stack"><label>Idea title<input name="title" required maxlength="100" placeholder="What would you like to explore?"></label><label>Likely lane<select name="lane">${lanes.map(l=>`<option>${l}</option>`).join('')}</select></label><label>Notes or original assignment<textarea name="notes" placeholder="The rough thought, the problem, a useful reference…"></textarea></label><div class="f-row"><button class="f-btn f-primary" type="submit">Save to Ideas</button>${button('Cancel','nav-ideas')}</div></form>`;}
function ideaDetail(){const i=ideas.find(x=>x.id===state.ideaId);return button('← Ideas','nav-ideas')+`<div class="f-space">${heading('Idea notebook',esc(i.title),'Explore freely. Activate when you are ready.')}</div><form id="f-notes-form" class="f-panel f-stack"><label>Brainstorm and references<textarea name="notes" style="min-height:150px">${esc(i.notes)}</textarea></label><div class="f-grid"><div><span class="f-small">QUESTIONS TO EXPLORE</span><p>Who is it for?<br>What makes it interesting?<br>What is the smallest useful version?</p></div><div><span class="f-small">POSSIBLE NEXT MOVE</span><p>Turn one answer into a small task with a clear stopping point.</p></div></div><div class="f-row"><button class="f-btn" type="submit">Save notes</button>${i.active?pill('Linked to active work'):button('Make active →','activate',true)}</div></form>`;}
function activate(){const i=ideas.find(x=>x.id===state.ideaId);return heading('From idea to action','Choose the first small step.',esc(i.title))+`<form id="f-activate-form" class="f-panel f-stack"><label>First task<input name="title" value="${esc('Explore '+i.title)}" required maxlength="120"></label><div class="f-grid"><label>Lane<select name="lane">${lanes.map(l=>`<option ${i.lane===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Estimated time<select name="mins"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></label></div><label>Done when<input name="done" placeholder="A concrete result you can recognise" required></label><div class="f-row"><button class="f-btn f-primary" type="submit">Add to ready work</button>${button('Keep exploring','idea',false,`data-id="${i.id}"`)}</div></form>`;}
function session(){const t=state.current;return `<div class="f-session">${heading('In session',esc(displayTitle(t)),'One thing deserves your attention right now.')}<div class="f-focus"><div class="f-row f-between">${pill(t.lane)}<span class="f-small">${duration(t)} minute intention · no countdown</span></div><div class="f-rule"><span class="f-small">PICK UP HERE</span><p>${esc(t.short?t.smallDone:t.next)}</p></div><span class="f-small">YOUR STOPPING POINT</span><p>${esc(doneText(t))}</p><div class="f-row f-space">${button('Finish & reflect →','recap',true)}${button('Cancel session','cancel-session')}</div></div><p class="f-caption">It is okay to finish early. A useful contribution counts.</p></div>`;}
function recap(){return `<div class="f-session">${heading('Session recap','What moved forward?','Capture enough context to make coming back easy.')}<form id="f-recap-form" class="f-panel f-stack"><label>How did the session go?<select name="outcome"><option>Finished</option><option>Made progress</option><option>Blocked</option></select></label><label>Your contribution<textarea name="note" required placeholder="What did you build, decide, investigate, or write?"></textarea></label><label>Next step or blocker<input name="next" placeholder="Where should you pick up next?"></label><label>Evidence link · optional<input name="url" type="url" placeholder="https://…"></label><div class="f-row"><button class="f-btn f-primary" type="submit">Save session</button>${button('Back to session','session')}</div></form></div>`;}
function success(){return `<div class="f-session"><div class="f-panel"><div class="f-done-mark" aria-hidden="true">✓</div>${heading('Session saved',visual.celebrations?'That counts. Keep the proof.':'Your progress is saved.','Your next session will start with this context.')}<p class="f-muted">${esc(history[history.length-1].note)}</p>${state.current.short?'<p class="f-caption">Smaller step completed. The parent task remains in progress.</p>':''}<div class="f-row f-space">${button('Back to Today →','nav-today',true)}${button('See your journey','nav-journey')}</div>${week()}</div></div>`;}
function proofList(){return heading('Your body of work','Make the progress visible.','A home for what you have made, learned, and shared.')+`<div class="f-grid">${proofs.map(p=>`<article class="f-panel f-stack"><div class="f-preview" aria-label="${p.type==='toggle'?'Illustrative toggle preview':'Illustrative typography preview'}">${p.type==='toggle'?'<div class="f-demo-toggle"><span></span></div>':`<div class="f-type-preview">${esc(p.type==='type'?'Small details.\nBetter experiences.':'A step forward.')}</div>`}</div><div class="f-row f-between"><span class="f-small">${esc(p.kind)}</span>${pill(p.state)}</div><h2>${esc(p.title)}</h2><p class="f-muted">${esc(p.note)}</p>${button('Review artifact →','proof',false,`data-id="${p.id}"`)}</article>`).join('')}</div>`;}
function proofDetail(){const p=proofs.find(x=>x.id===state.proofId);return button('← All proof','nav-proof')+`<div class="f-space">${heading('Artifact',esc(p.title),'Keep the work and its story together.')}</div><form id="f-proof-form" class="f-panel f-stack"><label>Context and contribution<textarea name="note">${esc(p.note)}</textarea></label><label>Status<select name="status">${['Draft','Ready to share','Published'].map(s=>`<option ${s===p.state?'selected':''}>${s}</option>`).join('')}</select></label><label>Published link<input name="url" type="url" value="${esc(p.url)}" placeholder="https://…"></label><label class="f-check"><input name="candidate" type="checkbox" ${p.candidate?'checked':''}>Portfolio candidate</label><p class="f-small">This records your publication. It does not post anything.</p><div><button class="f-btn f-primary" type="submit">Save artifact</button></div></form>`;}
function journey(){return heading('Becoming a design engineer','Look at what is taking shape.','Your progress belongs to you, including the quiet weeks.')+`<div class="f-grid"><div class="f-panel"><div class="f-eyebrow">This week</div><div class="f-hero-number">${history.length}<span class="f-muted"> / ${state.target}</span></div><p>meaningful sessions</p><div class="f-track"><span style="width:${Math.min(100,history.length/state.target*100)}%"></span></div><p class="f-small">${state.paused?'Paused week · streak evaluation on hold':'3 prior successful weeks · sample history'}</p></div><div class="f-panel"><div class="f-eyebrow">Balance across your practice</div>${lanes.map(l=>{const n=history.filter(h=>h.lane===l).length;return `<div class="f-space"><div class="f-row f-between"><span>${l}</span><span class="f-small">${n} session${n!==1?'s':''}</span></div><div class="f-track"><span style="width:${n/history.length*100}%"></span></div></div>`;}).join('')}</div></div><section class="f-panel f-space"><div class="f-row f-between"><h2>Your recent steps</h2>${pill('A practice, in progress')}</div>${history.slice().reverse().map(h=>`<div class="f-list-row"><div><h3>${esc(h.title)}</h3><p class="f-small">${esc(h.note)}</p><p class="f-small">${h.lane} · ${h.when}</p></div>${pill(h.outcome)}</div>`).join('')}</section>`;}
function settings(){return heading('Make it yours','A rhythm you can return to.','Your ambition stays steady. Your capacity can change.')+`<form id="f-settings-form" class="f-panel f-stack"><label>Your motive<textarea name="motive" required>${esc(state.motive)}</textarea></label><label>Weekly session target<select name="target">${[2,3,4,5].map(n=>`<option value="${n}" ${state.target===n?'selected':''}>${n} sessions per week</option>`).join('')}</select></label><p class="f-small">Preview changes apply immediately here. In the product, target changes start next week.</p><label class="f-check"><input type="checkbox" name="pause" ${state.paused?'checked':''}>Plan a pause for this week</label><div><button class="f-btn f-primary" type="submit">Save preferences</button></div></form><div class="f-panel f-space"><h3>First-visit experience</h3><p class="f-muted f-space">Explore how you would set your direction before your first session.</p><div class="f-space">${button('Preview setup →','setup')}</div></div><p class="f-caption">Prototype · sample data resets on reload. ChatGPT integration is planned for later.</p>`;}
function setup(){return `<div class="f-session"><div class="f-eyebrow">Welcome to Form</div><div class="f-steps">${['Your direction','Your rhythm','Your first step'].map((x,i)=>`<span class="f-step ${state.step===i+1?'f-current':''}">${i+1} · ${x}</span>`).join('')}</div>${heading('',state.step===1?'What are you growing toward?':state.step===2?'Make room for a little progress.':'Start with something that matters.',state.step===1?'Keep a personal reason close to your work.':state.step===2?'Choose a weekly intention you can adjust.':'Your tracker can be your first portfolio project.')}<form id="f-setup-form" class="f-panel f-stack">${state.step===1?`<label>Your motive<textarea name="motive" required>${esc(state.motive)}</textarea></label>`:state.step===2?`<label>Sessions per week<select name="target">${[2,3,4,5].map(n=>`<option value="${n}" ${n===state.target?'selected':''}>${n} sessions</option>`).join('')}</select></label><p class="f-muted">You choose which days. Rest days stay open.</p>`:'<h2>Form · Personal workspace</h2><p>First milestone: make the Today flow usable.</p><p class="f-small">Continue with the sample project to explore the experience.</p>'}<div class="f-row"><button class="f-btn f-primary" type="submit">${state.step===3?'Go to Today →':'Continue →'}</button>${button('Skip setup','nav-today')}</div></form></div>`;}
function render(){root.querySelector('#f-motive').textContent=state.motive;root.querySelector('#f-crumb').textContent=state.page;root.querySelector('#f-nav').innerHTML=nav.map(([n,i])=>`<button class="f-nav" data-page="${n}" ${state.page===n?'aria-current="page"':''}><i data-lucide="${i}" aria-hidden="true"></i>${n}</button>`).join('');const pages={Today:today,Work:work,Ideas:ideaList,Proof:proofList,Journey:journey,Settings:settings,Task:taskDetail,Project:project,'New idea':ideaForm,Notebook:ideaDetail,Activate:activate,Session:session,Recap:recap,Saved:success,Setup:setup,Artifact:proofDetail};view.innerHTML=pages[state.page]();applyVisual();icon();}
function applyVisual(){root.querySelectorAll('.f-panel,.f-focus').forEach(x=>x.style.borderRadius=visual.corners+'px');}
function go(page){if(state.current&&!['Saved'].includes(state.page)&&['Session','Recap'].includes(state.page)&&!['Session','Recap'].includes(page)){notify('Finish or cancel your current session before switching work.');return;}state.page=page;render();}
root.addEventListener('change',e=>{if(e.target.id==='f-energy'){state.energy=Number(e.target.value);state.chosen=null;render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button[type="submit"]');if(!b)return;e.preventDefault();const form=b.closest('form');if(form&&form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));},true);
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input:not([type="checkbox"])')){const form=e.target.closest('form');if(form){e.preventDefault();if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.time){state.time=Number(b.dataset.time);state.chosen=null;render();return;}const a=b.dataset.action,id=Number(b.dataset.id);if(!a)return;if(a.startsWith('nav-')){go({today:'Today',work:'Work',ideas:'Ideas',proof:'Proof',journey:'Journey'}[a.slice(4)]);return;}if(a==='choose'){state.chosen=id;const t=tasks.find(t=>t.id===id);if(t.mins>state.time&&!t.small){state.time=t.mins;notify('Capacity adjusted to this task’s estimate.');}go('Today');}else if(a==='task'){state.taskId=id;go('Task');}else if(a==='project')go('Project');else if(a==='new-idea')go('New idea');else if(a==='idea'){state.ideaId=id;go('Notebook');}else if(a==='activate')go('Activate');else if(a==='proof'){state.proofId=id;go('Artifact');}else if(a==='start'){state.current={...activeTask()};go('Session');}else if(a==='recap')go('Recap');else if(a==='session')go('Session');else if(a==='cancel-session'){state.current=null;go('Today');notify('Session cancelled. No progress was recorded.');}else if(a==='unblock'){tasks.find(t=>t.id===id).state='Ready';render();notify('Task is ready again.');}else if(a==='setup'){state.step=1;go('Setup');}});
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target,d=new FormData(form);if(form.id==='f-idea-form'){const title=d.get('title').trim();if(!title){notify('Add a title for your idea.');return;}ideas.push({id:Date.now(),title,lane:d.get('lane'),notes:d.get('notes').trim(),active:false});go('Ideas');notify('Idea saved. It stays out of your daily queue until you activate it.');}else if(form.id==='f-notes-form'){ideas.find(i=>i.id===state.ideaId).notes=d.get('notes');notify('Brainstorm notes saved for this preview.');}else if(form.id==='f-activate-form'){if(!d.get('title').trim()||!d.get('done').trim()){notify('Add a first task and a clear stopping point.');return;}const i=ideas.find(i=>i.id===state.ideaId);i.active=true;tasks.push({id:Date.now(),title:d.get('title').trim(),lane:d.get('lane'),project:i.title,mins:Number(d.get('mins')),energy:1,state:'Ready',skill:'Design-engineering practice',done:d.get('done').trim(),next:d.get('done').trim()});go('Work');notify('First step added to ready work.');}else if(form.id==='f-recap-form'){if(!state.current||state.page!=='Recap')return;const note=d.get('note').trim(),next=d.get('next').trim(),outcome=d.get('outcome');if(!note){notify('Record a concrete contribution before saving.');return;}if(outcome!=='Finished'&&!next){notify('Add your next step or blocker so you can return with context.');return;}const t=tasks.find(t=>t.id===state.current.id);t.state=outcome==='Blocked'?'Blocked':outcome==='Finished'&&!state.current.short?'Done':'In progress';t.next=next||'Continue from the contribution recorded in your last session.';history.push({title:displayTitle(state.current),lane:t.lane,outcome,note,when:'Just now'});if(d.get('url'))proofs.push({id:Date.now(),title:displayTitle(state.current),kind:'Session evidence',state:'Draft',note,type:'note',url:d.get('url')});state.chosen=null;state.page='Saved';render();notify('Session recorded once. Your progress and next focus are updated.');}else if(form.id==='f-proof-form'){const p=proofs.find(p=>p.id===state.proofId);if(d.get('status')==='Published'&&!d.get('url').trim()){notify('Add the publication link before marking this published.');return;}Object.assign(p,{note:d.get('note'),state:d.get('status'),url:d.get('url'),candidate:d.has('candidate')});go('Proof');notify('Artifact updated. Nothing was published externally.');}else if(form.id==='f-settings-form'){state.motive=d.get('motive').trim()||state.motive;state.target=Number(d.get('target'));state.paused=d.has('pause');render();notify('Preview preferences updated.');}else if(form.id==='f-setup-form'){if(state.step===1)state.motive=d.get('motive').trim()||state.motive;if(state.step===2)state.target=Number(d.get('target'));if(state.step<3){state.step++;render();}else go('Today');}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyVisual();if(state.page==='Saved')render();}});tweak.addSlider(visual,'corners',{label:'Surface corners',min:4,max:24,unit:'px'});tweak.addToggle(visual,'celebrations',{label:'Celebratory completion language'});}
})();
</script>
