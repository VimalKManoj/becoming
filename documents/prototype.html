}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;

  }

  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

root.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;button&#x27;);if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.time){state.time=Number(b.dataset.time);state.chosen=null;render();return;}const a=b.dataset.action,id=Number(b.dataset.id);if(!a)return;if(a.startsWith(&#x27;nav-&#x27;)){go({today:&#x27;Today&#x27;,work:&#x27;Work&#x27;,ideas:&#x27;Ideas&#x27;,proof:&#x27;Proof&#x27;,journey:&#x27;Journey&#x27;}[a.slice(4)]);return;}if(a===&#x27;choose&#x27;){state.chosen=id;const t=tasks.find(t=&gt;t.id===id);if(t.mins&gt;state.time&amp;&amp;!t.small){state.time=t.mins;notify(&#x27;Capacity adjusted to this task’s estimate.&#x27;);}go(&#x27;Today&#x27;);}else if(a===&#x27;task&#x27;){state.taskId=id;go(&#x27;Task&#x27;);}else if(a===&#x27;project&#x27;)go(&#x27;Project&#x27;);else if(a===&#x27;new-idea&#x27;)go(&#x27;New idea&#x27;);else if(a===&#x27;idea&#x27;){state.ideaId=id;go(&#x27;Notebook&#x27;);}else if(a===&#x27;activate&#x27;)go(&#x27;Activate&#x27;);else if(a===&#x27;proof&#x27;){state.proofId=id;go(&#x27;Artifact&#x27;);}else if(a===&#x27;start&#x27;){state.current={...activeTask()};go(&#x27;Session&#x27;);}else if(a===&#x27;recap&#x27;)go(&#x27;Recap&#x27;);else if(a===&#x27;session&#x27;)go(&#x27;Session&#x27;);else if(a===&#x27;cancel-session&#x27;){state.current=null;go(&#x27;Today&#x27;);notify(&#x27;Session cancelled. No progress was recorded.&#x27;);}else if(a===&#x27;unblock&#x27;){tasks.find(t=&gt;t.id===id).state=&#x27;Ready&#x27;;render();notify(&#x27;Task is ready again.&#x27;);}else if(a===&#x27;setup&#x27;){state.step=1;go(&#x27;Setup&#x27;);}});

ession.&#x27;;history.push({title:displayTitle(state.current),lane:t.lane,outcome,note,when:&#x27;Just now&#x27;});if(d.get(&#x27;url&#x27;))proofs.push({id:Date.now(),title:displayTitle(state.current),kind:&#x27;Session evidence&#x27;,state:&#x27;Draft&#x27;,note,type:&#x27;note&#x27;,url:d.get(&#x27;url&#x27;)});state.chosen=null;state.page=&#x27;Saved&#x27;;render();notify(&#x27;Session recorded once. Your progress and next focus are updated.&#x27;);}else if(form.id===&#x27;f-proof-form&#x27;){const p=proofs.find(p=&gt;p.id===state.proofId);if(d.get(&#x27;status&#x27;)===&#x27;Published&#x27;&amp;&amp;!d.get(&#x27;url&#x27;).trim()){notify(&#x27;Add the publication link before marking this published.&#x27;);return;}Object.assign(p,{note:d.get(&#x27;note&#x27;),state:d.get(&#x27;status&#x27;),url:d.get(&#x27;url&#x27;),candidate:d.has(&#x27;candidate&#x27;)});go(&#x27;Proof&#x27;);notify(&#x27;Artifact updated. Nothing was published externally.&#x27;);}else if(form.id===&#x27;f-settings-form&#x27;){state.motive=d.get(&#x27;motive&#x27;).trim()||state.motive;state.target=Number(d.get(&#x27;target&#x27;));state.paused=d.has(&#x27;pause&#x27;);render();notify(&#x27;Preview preferences updated.&#x27;);}else if(form.id===&#x27;f-setup-form&#x27;){if(state.step===1)state.motive=d.get(&#x27;motive&#x27;).trim()||state.motive;if(state.step===2)state.target=Number(d.get(&#x27;target&#x27;));if(state.step&lt;3){state.step++;render();}else go(&#x27;Today&#x27;);}});
